name: Build Android APK

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: 📦 Install frontend dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: 🏗️ Build web app (production)
      working-directory: ./frontend
      run: npm run build
      
    - name: 🔄 Sync Capacitor
      working-directory: ./frontend
      run: npx cap sync android
      
    - name: 🎯 Make gradlew executable
      working-directory: ./frontend/android
      run: chmod +x ./gradlew
      
    - name: 🧹 Clean Gradle build (with retry)
      working-directory: ./frontend/android
      run: |
        for i in 1 2 3; do
          ./gradlew clean --no-daemon && break || sleep 10
        done
      
    - name: 📱 Build Debug APK (with retry)
      working-directory: ./frontend/android
      run: |
        for i in 1 2 3; do
          ./gradlew assembleDebug --no-daemon && break || sleep 10
        done
      
    - name: 🔐 Decode Release Keystore
      if: false  # Temporarily disabled - enable when Maven Central is stable
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > frontend/android/app/cem-release-key.keystore
      
    - name: 🏭 Build Release APK (with retry)
      if: false  # Temporarily disabled - enable when Maven Central is stable
      working-directory: ./frontend/android
      env:
        RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/app/cem-release-key.keystore
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        for i in 1 2 3; do
          ./gradlew assembleRelease --no-daemon && break || sleep 10
        done
      
    - name: 📤 Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: cem-farmer-debug-apk
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30
        
    - name: 📤 Upload Release APK
      if: false  # Temporarily disabled - enable when Maven Central is stable
      uses: actions/upload-artifact@v4
      with:
        name: cem-farmer-release-apk
        path: frontend/android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
        retention-days: 90
        
    - name: 📊 Build summary
      run: |
        echo "✅ Build completed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 APK Information" >> $GITHUB_STEP_SUMMARY
        echo "- **App Name**: CEM Farmer" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: com.cem.farmerapp" >> $GITHUB_STEP_SUMMARY
        echo "- **Debug APK**: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          echo "- **Release APK**: ✅ Signed and ready for distribution" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Download**: Check the artifacts section above ☝️" >> $GITHUB_STEP_SUMMARY
